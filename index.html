
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Performance Analysis</h1>
            <p>Module 2 - Student Management</p>
        </header>

        <section class="form-section">
            <h2 id="formTitle">Add New Student</h2>

            <form id="studentForm">
                <input type="hidden" id="editId">

                <div class="form-grid">
                    <div>
                        <label>Student ID</label>
                        <input type="text" id="studentId" placeholder="Enter Student ID" required>
                    </div>

                    <div>
                        <label>Student Name</label>
                        <input type="text" id="studentName" placeholder="Enter Student Name" required>
                    </div>

                    <div>
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Enter Email" required>
                    </div>

                    <div>
                        <label>Department</label>
                        <select id="department" required>
                            <option value="">Select Department</option>
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="IT">IT</option>
                            <option value="Mechanical">Mechanical</option>
                            <option value="Civil">Civil</option>
                        </select>
                    </div>

                    <div>
                        <label>Year</label>
                        <select id="year" required>
                            <option value="">Select Year</option>
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                        </select>
                    </div>

                    <div>
                        <label>Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter Phone Number" pattern="[0-9]{10}" maxlength="10" required>
                    </div>
                </div>

                <div class="buttons">
                    <button type="submit" id="submitBtn">Add Student</button>
                    <button type="button" id="cancelBtn" class="cancel" onclick="resetForm()">Clear</button>
                </div>
            </form>
        </section>

        <section class="table-section">
            <div class="table-header">
                <h2>Student Records</h2>
                <input type="text" id="searchInput" placeholder="Search by Name or Student ID...">
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Year</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable"></tbody>
                </table>
            </div>

            <p id="noData">No student records found.</p>
        </section>
    </div>

    <div id="studentModal" class="modal hidden" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Student Details</h3>
                <button type="button" id="closeModalBtn" class="close-btn">×</button>
            </div>
            <div class="detail-list">
                <p><strong>Student ID:</strong> <span id="modalStudentId"></span></p>
                <p><strong>Name:</strong> <span id="modalStudentName"></span></p>
                <p><strong>Email:</strong> <span id="modalStudentEmail"></span></p>
                <p><strong>Department:</strong> <span id="modalStudentDepartment"></span></p>
                <p><strong>Year:</strong> <span id="modalStudentYear"></span></p>
                <p><strong>Phone:</strong> <span id="modalStudentPhone"></span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
